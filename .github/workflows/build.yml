name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  visuals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visuals
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: visuals

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Build
        run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: arcanicvisuals
          path: visuals/build/libs/*.jar

  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: launcher\native\build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: arcanic-launcher
          path: launcher/native/build/Arcanic.exe
